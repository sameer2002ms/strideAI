services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strideAI_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strideAI_celery_worker
    command: celery -A config worker -l info
    volumes:
      - ./server:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strideAI_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./server:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres  

  postgres:
    image: postgres:15
    container_name: strideAI_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: strideAI_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data    

volumes:
  postgres_data:
  qdrant_data:
  redis_data: